name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # A direct download link to a private copy of the USA (Rev 1) ROM, set as a repository secret.
      # The ROM is never part of the repository; without the secret the build is skipped.
      BASEROM_URL: ${{ secrets.BASEROM_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check for the base ROM
        if: env.BASEROM_URL == ''
        run: echo "::notice::BASEROM_URL secret not set, skipping the build."

      - uses: actions/setup-python@v5
        if: env.BASEROM_URL != ''
        with:
          python-version: "3.12"

      - name: Install Ninja
        if: env.BASEROM_URL != ''
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Download the base ROM
        if: env.BASEROM_URL != ''
        run: |
          curl -sSfL "$BASEROM_URL" -o extract/baserom_acww_usa.nds
          echo "77fde3e30e1e6068395d1f96ea63be569b61c351  extract/baserom_acww_usa.nds" | sha1sum -c -

      - name: Configure
        if: env.BASEROM_URL != ''
        run: python3 tools/configure.py usa

      - name: Build and verify the ROM
        if: env.BASEROM_URL != ''
        run: ninja

      # Module layout check; `ninja check_symbols` is not run because data inside compiled files carries
      # compiler-local names (@NN) that dsd cannot match to the data_ symbols in config/.
      - name: Check module layout
        if: env.BASEROM_URL != ''
        run: ninja check_modules
